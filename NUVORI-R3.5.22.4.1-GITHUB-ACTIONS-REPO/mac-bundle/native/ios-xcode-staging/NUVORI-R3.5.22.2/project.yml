name: NUVORI
options:
  createIntermediateGroups: true
  bundleIdPrefix: com.nuvori
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  NUVORI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../ios-swiftui/NUVORI
        excludes:
          - "**/*.md"
    resources:
      - path: Resources
    info:
      path: Support/Info.plist
    entitlements:
      path: Support/NUVORI.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuvori.app
        PRODUCT_NAME: NUVORI
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/NUVORI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
        NUVORI_API_BASE_URL: ""
    scheme:
      testTargets: []
